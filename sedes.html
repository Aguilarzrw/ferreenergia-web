<!doctype html>
<html lang="es-VE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sedes y contacto | Ferreenergía VE</title>
  <meta name="description" content="Sedes en San Jacinto (Aragua) y Camaguán (Guárico). Cómo llegar, teléfonos y preguntas frecuentes." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta property="og:title" content="Sedes y contacto | Ferreenergía VE" />
  <meta property="og:image" content="https://aguilarzrw.github.io/ferreenergia-web/og.png" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%img/logo.svg" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  <script type="module" src="/src/main.js"></script>
</head>
<body data-page="sedes">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <main id="contenido">
    <header class="phead">
      <div class="wrap">
        <nav class="crumbs" aria-label="Ruta"><a href="./">Inicio</a><span aria-hidden="true">/</span><span aria-current="page">Sedes y contacto</span></nav>
        <h1 class="display">Dos sedes, cerca de ti</h1>
        <p class="lead">Visítanos, llámanos o escríbenos por WhatsApp.</p>
      </div>
    </header>

    <section class="sec sec--tight" aria-label="Sedes">
      <div class="wrap sedes__layout">
        <h2 class="sr">Nuestras sedes</h2>
        <div class="sede__list" id="sede-list"></div>
        <figure class="map">
          <svg id="map" viewBox="0 0 800 700" role="img" aria-label="Mapa estilizado de Venezuela con las sedes de San Jacinto (Aragua) y Camaguán (Guárico)"></svg>
          <figcaption>Ilustración estilizada, no a escala.</figcaption>
        </figure>
      </div>
    </section>

    <section class="sec sec--alt faq" aria-labelledby="faq-title">
      <div class="wrap wrap--narrow">
        <header class="sec__head"><h2 class="display" id="faq-title">Lo que más nos preguntan</h2></header>
        <div class="acc" id="acc"></div>
      </div>
    </section>

    <section class="strip" aria-label="Contacto">
      <div class="wrap strip__inner">
        <p><b>¿Tienes otra pregunta?</b> Te respondemos por WhatsApp.</p>
        <a class="btn btn--yellow btn--sm" data-wa="Hola Ferreenergía, tengo una pregunta." href="#"><span data-icon="wa" data-size="18"></span> Escribir por WhatsApp</a>
      </div>
    </section>
  </main>
</body>
</html>
